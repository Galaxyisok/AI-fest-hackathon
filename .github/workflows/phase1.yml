name: Phase 1 backend
on:
  push:
    branches: [phase-1]
  pull_request:
    paths: ['backend/**', 'tests/**', 'contracts/**', '.github/workflows/phase1.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.lock
      - run: python -m pytest -q
