name: Tests
on:
  push:
    branches: [main, phase-1, phase-2]
  pull_request:
permissions:
  contents: read
jobs:
  profile-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.lock
      - run: python -m pytest -q
  judge-and-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: proxy
      - run: npm test
        working-directory: proxy
      - run: node --test eval/lib/lib.test.mjs
  # The Android unit tests run locally with ./gradlew testDebugUnitTest. They are not run here
  # because the build first downloads a 40 MB speech model.
